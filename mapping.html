<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Mapping Resi ke Kota</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Poppins',sans-serif;
    background:radial-gradient(circle at top,#1e293b,#020617);
    color:#e2e8f0;
    padding:30px;
    text-align:center;
}

.container{
    max-width:900px;
    margin:auto;
    background:rgba(30,41,59,0.85);
    backdrop-filter:blur(12px);
    padding:30px;
    border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,0.7);
    animation:fadeIn 0.6s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px)}
    to{opacity:1; transform:translateY(0)}
}

h2{margin-bottom:20px;letter-spacing:1px}

input{
    margin:10px;
    padding:12px;
    border-radius:10px;
    border:none;
    background:#020617;
    color:#fff;
    width:80%;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#22c55e,#4ade80);
    color:#000;
    font-weight:bold;
    cursor:pointer;
    margin-top:15px;
    transition:0.25s;
}

button:hover{
    transform:translateY(-2px) scale(1.03);
    box-shadow:0 10px 25px rgba(34,197,94,0.4);
}

.back-btn{
    display:inline-block;
    margin-top:20px;
    padding:14px 28px;
    border-radius:14px;

    text-decoration:none;
    font-weight:700;
    color:white;

    background:linear-gradient(135deg,#ff6a00,#ee0979,#7f00ff);
    background-size:200% 200%;

    box-shadow:
        0 10px 30px rgba(238,9,121,0.35),
        0 0 25px rgba(127,0,255,0.25);

    transition:0.35s ease;
    animation:gradientMove 4s ease infinite;
}

.back-btn:hover{
    transform:translateY(-4px) scale(1.05);

    box-shadow:
        0 15px 40px rgba(255,106,0,0.5),
        0 0 35px rgba(238,9,121,0.7),
        0 0 50px rgba(127,0,255,0.5);
}

@keyframes gradientMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.log{
    margin-top:20px;
    text-align:center;
    background:#020617;
    padding:15px;
    border-radius:12px;
    height:170px;
    overflow:auto;
    font-size:13px;
}

.log div{
    margin-bottom:4px;
    animation:fadeItem 0.3s ease;
}

@keyframes fadeItem{
    from{opacity:0; transform:translateY(5px)}
    to{opacity:1; transform:translateY(0)}
}

.not-found{
    color:#f87171;
}

.progress-wrapper{
    margin-top:25px;
    text-align:center;
}

.progress-text{
    margin-bottom:10px;
    font-size:14px;
    font-weight:500;
}

.progress-bar{
    width:100%;
    height:22px;
    background:#020617;
    border-radius:20px;
    overflow:hidden;
    box-shadow:inset 0 0 15px rgba(0,0,0,0.8);
}

.progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#22c55e,#4ade80,#22c55e);
    background-size:200% 100%;
    border-radius:20px;
    transition:width 0.3s ease;
    animation:moveGradient 2s linear infinite;
}

@keyframes moveGradient{
    0%{background-position:0%}
    100%{background-position:200%}
}

.summary{
    margin-top:15px;
    font-weight:600;
    font-size:15px;
}

</style>
</head>

<body>

<div class="container">
<h2>📦 Mapping Resi → Kota + Status</h2>

<p>Upload Tabel Hasil Tracking (Resi + Kota + Status)</p>
A. <input type="file" id="fileA" accept=".xlsx,.xls">

<p>Upload Tabel Resi.xlsx</p>
B. <input type="file" id="fileB" accept=".xlsx,.xls">

<br>
<button onclick="processData()">🚀 Proses</button>
<button onclick="downloadResult()">⬇️ Download Hasil</button>

<br><br>

<a href="index.html" class="back-btn">
    ⬅ Kembali ke Home
</a>

<div class="progress-wrapper">
    <div class="progress-text" id="progressText">Menunggu proses...</div>
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>
</div>

<div class="summary" id="summary"></div>

<div class="log" id="log"></div>
</div>

<script>
let resultData = [];

let logBuffer = [];

function flushLog(){
    if(logBuffer.length > 0){
        const el = document.getElementById('log');
        el.innerHTML += logBuffer.join('');
        el.scrollTop = el.scrollHeight;
        logBuffer = [];
    }
}

function log(msg, isError=false){
    logBuffer.push(`<div class="${isError ? 'not-found':''}">${msg}</div>`);

    // flush tiap 50 item biar ringan
    if(logBuffer.length >= 50){
        flushLog();
    }
}

function readExcel(file){
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = function(e){
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type:'array'});
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(sheet, {header:1});
            resolve(json);
        };
        reader.readAsArrayBuffer(file);
    });
}

function setProgress(percent, text){
    document.getElementById('progressFill').style.width = percent + '%';
    document.getElementById('progressText').innerText = text + ' (' + percent + '%)';
}

// jeda ringan biar UI gak freeze
function delay(){
    return new Promise(resolve => setTimeout(resolve, 0));
}

async function processData(){
    const fileA = document.getElementById('fileA').files[0];
    const fileB = document.getElementById('fileB').files[0];

    if(!fileA || !fileB){
        alert('Upload kedua file dulu!');
        return;
    }

    document.getElementById('log').innerHTML = '';
    resultData = [];

    setProgress(0, 'Mulai...');

    log('Membaca file A...');
    const dataA = await readExcel(fileA);
    setProgress(20, 'File A dibaca');

    log('Membaca file B...');
    const dataB = await readExcel(fileB);
    setProgress(40, 'File B dibaca');

    log('Mapping data...');

    let mapA = {};
    for(let i=1;i<dataA.length;i++){
        let resi = String(dataA[i][0] || '').trim();
        let kota = String(dataA[i][1] || '').trim();
        let status = String(dataA[i][2] || '').trim();

        if(resi){
            mapA[resi] = { kota, status };
        }
    }

    let headerB = dataB[0] || [];
    resultData = [[...headerB, 'Kota', 'Status']];

    let found = 0;
    let notFound = 0;
    let total = dataB.length - 1;

    for(let i=1;i<dataB.length;i++){
        let rowB = dataB[i];
        let resi = String(rowB[0] || '').trim();

        let data = mapA[resi];
        let kota = 'TIDAK DITEMUKAN';
        let status = 'TIDAK ADA STATUS';

        if(data){
            kota = data.kota || 'TIDAK DITEMUKAN';
            status = data.status || 'TIDAK ADA STATUS';
            found++;
            log(`✔ ${resi} → ${kota} | ${status}`);
        } else {
            notFound++;
            log(`✖ ${resi} → TIDAK DITEMUKAN`, true);
        }

        resultData.push([...rowB, kota, status]);

        // update progress tiap 100 data aja
        if(i % 100 === 0){
            let percent = 40 + Math.round((i/total)*60);
            setProgress(percent, 'Memproses data...');
            await delay(); // penting biar gak freeze
        }
    }

    flushLog(); // tampilkan sisa log

    setProgress(100, 'Selesai');
    document.getElementById('summary').innerText = `✔ ${found} | ✖ ${notFound}`;

    log(`Selesai! ✔ ${found} | ✖ ${notFound}`);
    flushLog();
}

function downloadResult(){
    if(resultData.length === 0){
        alert('Belum ada data!');
        return;
    }

    const ws = XLSX.utils.aoa_to_sheet(resultData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Hasil Mapping');

    XLSX.writeFile(wb, 'hasil_mapping.xlsx');
}

/* ===== ANTI INSPECT ===== */

document.addEventListener('contextmenu', function(e){
    e.preventDefault();
});

document.onkeydown = function(e){

    // F12
    if(e.keyCode == 123){
        return false;
    }

    // CTRL + SHIFT + I
    if(e.ctrlKey && e.shiftKey && e.keyCode == 73){
        return false;
    }

    // CTRL + SHIFT + J
    if(e.ctrlKey && e.shiftKey && e.keyCode == 74){
        return false;
    }

    // CTRL + U
    if(e.ctrlKey && e.keyCode == 85){
        return false;
    }

    // CTRL + SHIFT + C
    if(e.ctrlKey && e.shiftKey && e.keyCode == 67){
        return false;
    }

};


document.onselectstart = function(e){

    if(e.target.closest("#listKantong")){
        return true;
    }

    return false;
};


(function(){

function detectDevTools(){

    const start = new Date();

    debugger;

    const end = new Date();

    if(end - start > 100){

        document.body.innerHTML =
        "<h1 style='color:red;text-align:center;margin-top:100px;'>SECURITY BLOCKED</h1>";

    }

}

setInterval(detectDevTools,1000);

})();

// ===== KLIK NOMOR KANTONG AUTO COPY =====
document.addEventListener("click", function(e){

    if(e.target.tagName === "TD" && e.target.parentElement.parentElement.id === "listKantong"){

        var teks = e.target.innerText;

        navigator.clipboard.writeText(teks).then(function(){

            // efek notifikasi kecil
            e.target.style.background = "#00c896";

            setTimeout(function(){
                e.target.style.background = "";
            },500);

        });

    }

});


</script>

</body>
</html>
