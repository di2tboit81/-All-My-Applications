<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Resi Auto Processor FINAL BOSS</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    padding: 20px;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #fff;
}

/* CONTAINER */
body > * {
    max-width: 1100px;
    margin: auto;
}

/* TITLE */
h2 {
    text-align: center;
    margin-bottom: 20px;
}

/* GLASS CARD */
table, #dropZone, #status, button {
    backdrop-filter: blur(10px);
    background: rgba(255,255,255,0.1);
    border-radius: 12px;
}

/* DROP ZONE */
#dropZone {
    border: 2px dashed rgba(255,255,255,0.5);
    padding: 50px;
    text-align: center;
    margin-bottom: 20px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

#dropZone:hover {
    background: rgba(255,255,255,0.2);
    transform: scale(1.02);
}

/* STATUS */
#status {
    padding: 10px;
    text-align: center;
}

/* BUTTON */
button {
    display: block;
    margin: 10px auto;
    padding: 12px 25px;
    font-weight: bold;
    cursor: pointer;
    border: none;
    color: white;
    background: linear-gradient(45deg, #00c6ff, #0072ff);
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(0,0,0,0.3);
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
    overflow: hidden;
}

/* HEADER */
th {
    padding: 12px;
    background: rgba(0,0,0,0.4);
    color: #fff;
    font-weight: bold;
}

/* CELL */
td {
    padding: 10px;
    text-align: center;
    color: #fff;
}

/* ROW EFFECT */
tr:hover {
    background: rgba(255,255,255,0.1);
}

/* RESPONSIVE */
@media (max-width: 768px) {
    #dropZone {
        padding: 30px;
        font-size: 14px;
    }

    th, td {
        font-size: 12px;
        padding: 6px;
    }

    button {
        width: 100%;
    }
}

/* TOMBOL KEMBALI */

.btn-kembali{

display:flex;
justify-content:center;
align-items:center;

width:260px;
height:48px;

margin:10px auto;

border-radius:14px;

font-weight:bold;
font-size:15px;
letter-spacing:0.6px;

text-decoration:none;
color:white;

background:
linear-gradient(
135deg,
#8e2de2,
#4a00e0,
#00c6ff
);

background-size:300% 300%;

box-shadow:
0 8px 25px rgba(0,114,255,0.35),
0 0 25px rgba(142,45,226,0.3);

transition:0.35s ease;

animation:gradientFlow 5s ease infinite;

position:relative;
overflow:hidden;

}

/* HOVER */

.btn-kembali:hover{

transform:translateY(-4px) scale(1.03);

box-shadow:
0 0 20px rgba(0,198,255,0.8),
0 0 40px rgba(142,45,226,0.7),
0 0 60px rgba(74,0,224,0.6);

}

/* EFEK KILAU */

.btn-kembali::before{

content:'';

position:absolute;
top:0;
left:-120%;

width:60%;
height:100%;

background:
linear-gradient(
120deg,
transparent,
rgba(255,255,255,0.75),
transparent
);

transform:skewX(-25deg);

transition:0.7s;

}

.btn-kembali:hover::before{

left:130%;

}

/* ANIMASI */

@keyframes gradientFlow{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}

</style>
</head>

<body>

<h2>🚀 Upload / Drag Excel</h2>

<div id="dropZone">Klik atau Drop file Excel di sini</div>
<input type="file" id="fileInput" multiple style="display:none">

<div id="status">Belum ada file</div>

<div style="text-align:center;margin-bottom:15px;">

<input 
type="text" 
id="manualPengajuan" 
placeholder="Contoh: PENGAJUAN 01"
style="
padding:10px;
width:260px;
border:none;
border-radius:10px;
font-weight:bold;
text-align:center;
font-size:15px;
">

</div>

<button onclick="downloadSemuaExcel()">⬇️ Download Excel</button>

<a href="index.html" class="btn-kembali">
⮌ KEMBALI KE HOME
</a>

<table>
<thead>
<tr>
<th>CODE COLY</th>
<th>RESI AWAL</th>
<th>RESI REJECT</th>
<th>OK</th>
<th>STATUS</th>
</tr>
</thead>
<tbody id="tbody">
<tr>
<td colspan="5">Silakan upload file Excel...</td>
</tr>
</tbody>
</table>

<script>

let hasilMap = {};

const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
const statusText = document.getElementById("status");

dropZone.onclick = () => fileInput.click();

dropZone.addEventListener("dragover", e => {
    e.preventDefault();
    dropZone.style.background = "#eee";
});

dropZone.addEventListener("dragleave", () => {
    dropZone.style.background = "";
});

dropZone.addEventListener("drop", e => {
    e.preventDefault();
    dropZone.style.background = "";
    handleFiles(e.dataTransfer.files);
});

fileInput.addEventListener("change", e => {
    handleFiles(e.target.files);
});

function handleFiles(files) {

    if (!files.length) return;

    hasilMap = {};

    statusText.innerText = "⏳ Memproses...";

    let processed = 0;

    for (let file of files) {

        let reader = new FileReader();

        reader.onload = function(e) {

            try {

                let data = new Uint8Array(e.target.result);

                let workbook = XLSX.read(data, { type: "array" });

                workbook.SheetNames.forEach(sheetName => {

                    let sheet = workbook.Sheets[sheetName];

                    let rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

                    proses(rows);

                });

            } catch (err) {

                statusText.innerText = "❌ Error file!";

            }

            processed++;

            if (processed === files.length) {

                tampilkan();

                statusText.innerText = "✅ Selesai";

            }

        };

        reader.readAsArrayBuffer(file);

    }

}

function bersih(teks) {

    return teks ? teks.toString().trim() : "";

}

function proses(rows) {

    let header = rows[0] || [];

    let idxNomor = header.findIndex(h =>
        h && h.toString().toUpperCase().includes("NOMOR")
    );

    let idxTotal = header.findIndex(h =>
        h && h.toString().toUpperCase().includes("TOTAL")
    );

    let idxCode = header.findIndex(h =>
        h && h.toString().toUpperCase().includes("CODE")
    );

    let idxJumlah = header.findIndex(h =>
        h && h.toString().toUpperCase().includes("JUMLAH")
    );

    rows.slice(1).forEach(row => {

        let nomor = bersih(row[idxNomor]);

        let total = parseInt(bersih(row[idxTotal])) || 0;

        let code = bersih(row[idxCode]);

        let jumlah = parseInt(bersih(row[idxJumlah])) || 0;

        // RESI AWAL
        if (nomor) {

            if (!hasilMap[nomor]) {

                hasilMap[nomor] = {
                    total: 0,
                    jumlah: 0
                };

            }

            hasilMap[nomor].total += total;

        }

        // RESI REJECT
        if (code) {

            if (!hasilMap[code]) {

                hasilMap[code] = {
                    total: 0,
                    jumlah: 0
                };

            }

            hasilMap[code].jumlah += jumlah;

        }

    });

}

function tampilkan() {

    let tbody = document.getElementById("tbody");

    tbody.innerHTML = "";

    let rowsMerah = [];
    let rowsKuning = [];
    let rowsHijau = [];

    Object.keys(hasilMap).forEach(kode => {

        let d = hasilMap[kode];

        let total = d.total || 0;

        let reject = d.jumlah || 0;

        let ok = total - reject;

        let status = "";

        let warna = "";

        // ===== FULL KANTONG REJECT =====
        if (total > 0 && reject > 0 && ok === 0) {

            status = "FULL KANTONG REJECT";

            warna = "#ff4d4d";

        }

        // ===== SELISIH =====
        else if (total > 0 && reject > 0 && ok !== 0) {

            status = "SELISIH RESI / CN";

            warna = "#ffd11a";

        }

        // ===== FULL KANTONG OK =====
        else if (total > 0 && reject === 0) {

            status = "FULL KANTONG OK";

            warna = "#00c853";

        }

        let rowHtml = `
        <tr style="background:${warna}; color:black; font-weight:bold;">
            <td>${kode}</td>
            <td>${total}</td>
            <td>${reject}</td>
            <td>${ok}</td>
            <td>${status}</td>
        </tr>`;

        // URUTKAN WARNA
        if (warna === "#ff4d4d") {

            rowsMerah.push(rowHtml);

        } else if (warna === "#ffd11a") {

            rowsKuning.push(rowHtml);

        } else if (warna === "#00c853") {

            rowsHijau.push(rowHtml);

        }

    });

    tbody.innerHTML =
        rowsMerah.join("") +
        rowsKuning.join("") +
        rowsHijau.join("");

}

/* STYLE EXCEL */

const borderAll = {

    border: {

        top: { style: "thin" },

        bottom: { style: "thin" },

        left: { style: "thin" },

        right: { style: "thin" }

    }

};

const headerStyle = {

    font: {
        bold: true,
        color: { rgb: "FFFFFF" }
    },

    fill: {
        fgColor: { rgb: "007BFF" }
    },

    alignment: {
        horizontal: "center"
    },

    ...borderAll

};

function exportExcel() {

    let data = [];

    // HEADER
    data.push([

        { v: "CODE COLY", s: headerStyle },

        { v: "RESI AWAL", s: headerStyle },

        { v: "RESI REJECT", s: headerStyle },

        { v: "OK", s: headerStyle },

        { v: "STATUS", s: headerStyle }

    ]);

    let rowsMerah = [];

    let rowsKuning = [];

    let rowsHijau = [];

    Object.keys(hasilMap).forEach((kode) => {

        let d = hasilMap[kode];

        let total = d.total || 0;

        let reject = d.jumlah || 0;

        let ok = total - reject;

        let status = "";

        let color = "";

        // ===== FULL KANTONG REJECT =====
        if (total > 0 && reject > 0 && ok === 0) {

            status = "FULL KANTONG REJECT";

            color = "FF4D4D";

        }

        // ===== SELISIH =====
        else if (total > 0 && reject > 0 && ok !== 0) {

            status = "SELISIH RESI / CN";

            color = "FFD11A";

        }

        // ===== FULL KANTONG OK =====
        else if (total > 0 && reject === 0) {

            status = "FULL KANTONG OK";

            color = "00C853";

        }

        let rowData = [

            {
                v: kode,
                s: {
                    font: { bold: true },
                    alignment:{horizontal:"center"},
                    fill:{fgColor:{rgb:color}},
                    ...borderAll
                }
            },

            {
                v: total,
                s: {
                    alignment:{horizontal:"center"},
                    fill:{fgColor:{rgb:color}},
                    ...borderAll
                }
            },

            {
                v: reject,
                s: {
                    alignment:{horizontal:"center"},
                    fill:{fgColor:{rgb:color}},
                    ...borderAll
                }
            },

            {
                v: ok,
                s: {
                    font:{bold:true},
                    alignment:{horizontal:"center"},
                    fill:{fgColor:{rgb:color}},
                    ...borderAll
                }
            },

            {
                v: status,
                s: {
                    font:{bold:true},
                    alignment:{horizontal:"center"},
                    fill:{fgColor:{rgb:color}},
                    ...borderAll
                }
            }

        ];

        // URUTKAN WARNA
        if (color === "FF4D4D") {

            rowsMerah.push(rowData);

        } else if (color === "FFD11A") {

            rowsKuning.push(rowData);

        } else if (color === "00C853") {

            rowsHijau.push(rowData);

        }

    });

    data = data
    .concat(rowsHijau)
    .concat(rowsKuning)
    .concat(rowsMerah);

    let worksheet = XLSX.utils.aoa_to_sheet(data);

    // AUTO WIDTH
    worksheet["!cols"] = [

        { wch: 25 },

        { wch: 15 },

        { wch: 15 },

        { wch: 15 },

        { wch: 28 }

    ];

    let workbook = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(workbook, worksheet, "Hasil");

    XLSX.writeFile(workbook, "hasil_resi_final_boss.xlsx");

}

// ===== DOWNLOAD 2 FILE SEKALIGUS =====
function downloadSemuaExcel(){

    // VALIDASI INPUT PENGAJUAN
    let manualInput = document.getElementById("manualPengajuan").value.trim();

    if(manualInput === ""){

        alert("⚠️ Silakan isi kolom PENGAJUAN terlebih dahulu!");

        document.getElementById("manualPengajuan").focus();

        return;

    }

    // FILE LAMA
    exportExcel();

    // FILE BARU
    setTimeout(function(){

        exportPengajuanExcel();

    },700);

}



function exportPengajuanExcel(){

    let workbook = XLSX.utils.book_new();

    let ws = {};

    let merges = [];

    let dataList = [];



    // AMBIL DATA
    Object.keys(hasilMap).forEach((kode)=>{

        let d = hasilMap[kode];

        let total = d.total || 0;

        let reject = d.jumlah || 0;

        let ok = total - reject;

        if(total > 0 && !(reject > 0 && ok === 0)){

            dataList.push({

                kode:kode,

                // ANGKA KECIL KANAN
                total:ok,

                // TOTAL PENGAJUAN BAWAH
                pengajuan:ok

            });

        }

    });



    // STYLE
    const border = {

        top:{style:"thin"},

        bottom:{style:"thin"},

        left:{style:"thin"},

        right:{style:"thin"}

    };



    const styleText = {

        font:{bold:true},

        alignment:{
            horizontal:"center",
            vertical:"center"
        },

        border:border

    };



    const stylePengajuan = {

    font:{
        bold:true,
        color:{rgb:"000000"}
    },

    fill:{
        fgColor:{rgb:"FFFF00"}
    },

    alignment:{
        horizontal:"center",
        vertical:"center"
    },

    border:{
        top:{style:"thin", color:{rgb:"000000"}},
        bottom:{style:"thin", color:{rgb:"000000"}},
        left:{style:"thin", color:{rgb:"000000"}},
        right:{style:"thin", color:{rgb:"000000"}}
    }

};


    // ===== SUSUN =====
    // 1 BLOK = 10 DATA KE BAWAH

    let perBlok = 10;

    let totalBlok = Math.ceil(dataList.length / perBlok);



    for(let blok=0; blok<totalBlok; blok++){

        // posisi kolom TANPA JARAK
        let colAwal = blok * 2;



        // ambil data per 10
        let items = dataList.slice(

            blok * perBlok,

            (blok + 1) * perBlok

        );



        items.forEach((item,index)=>{

            let row = index;



            // CODE
            let cellKode = XLSX.utils.encode_cell({

                r:row,

                c:colAwal

            });

            ws[cellKode] = {

                v:item.kode,

                t:"s",

                s:styleText

            };



            // TOTAL
            let cellTotal = XLSX.utils.encode_cell({

                r:row,

                c:colAwal + 1

            });

            ws[cellTotal] = {

                v:item.total,

                t:"n",

                s:styleText

            };

        });



        // ===== TOTAL PENGAJUAN =====
        let totalPengajuan = items.reduce((a,b)=>{

            return a + b.pengajuan;

        },0);



        // INPUT MANUAL
        let manualText = document.getElementById("manualPengajuan").value.trim();



        let pengajuanRow = 10;



        let cellPengajuan = XLSX.utils.encode_cell({

            r:pengajuanRow,

            c:colAwal

        });



        ws[cellPengajuan] = {

            v: manualText 
                ? manualText.toUpperCase() 
                : ("PENGAJUAN " + totalPengajuan),

            t:"s",

            s:stylePengajuan

        };
		
		



        // MERGE PENGAJUAN
        merges.push({

            s:{
                r:pengajuanRow,
                c:colAwal
            },

            e:{
                r:pengajuanRow,
                c:colAwal + 1
            }

        });

    }



    // ===== TOTAL SEMUA KANTONG =====
    let totalKantong = dataList.length;

    let totalKantongRow = 12;



    let cellTotalKantong = XLSX.utils.encode_cell({

        r: totalKantongRow,

        c: 0

    });



ws[cellTotalKantong] = {

    v: "JUMLAH KANTONG : " + totalKantong + " KANTONG",

    t: "s",

    s: {

        font:{
            bold:true,
            sz:16,
            color:{rgb:"000000"}
        },

        alignment:{
            horizontal:"left",
            vertical:"center"
        }

    }

};



        // RANGE
    ws["!ref"] = XLSX.utils.encode_range({

        s:{r:0,c:0},

        e:{r:13,c:(totalBlok*2)}

    });



    // MERGE
    ws["!merges"] = merges;



    // LEBAR
    ws["!cols"] = [];



    for(let i=0;i<(totalBlok*2);i++){

        if(i % 2 == 0){

            ws["!cols"].push({wch:26});

        }else{

            ws["!cols"].push({wch:8});

        }

    }



    // SHEET
    XLSX.utils.book_append_sheet(

        workbook,
        ws,
        "Pengajuan"

    );



    // DOWNLOAD
    XLSX.writeFile(

        workbook,
        "hasil_pengajuan.xlsx"

    );

}


/* ===== ANTI INSPECT ===== */

document.addEventListener('contextmenu', function(e){

    e.preventDefault();

});

document.onkeydown = function(e){

    // F12
    if(e.keyCode == 123){
        return false;
    }

    // CTRL + SHIFT + I
    if(e.ctrlKey && e.shiftKey && e.keyCode == 73){
        return false;
    }

    // CTRL + SHIFT + J
    if(e.ctrlKey && e.shiftKey && e.keyCode == 74){
        return false;
    }

    // CTRL + U
    if(e.ctrlKey && e.keyCode == 85){
        return false;
    }

    // CTRL + SHIFT + C
    if(e.ctrlKey && e.shiftKey && e.keyCode == 67){
        return false;
    }

};

document.onselectstart = function(e){

    if(e.target.closest("#listKantong")){
        return true;
    }

    return false;

};

(function(){

function detectDevTools(){

    const start = new Date();

    debugger;

    const end = new Date();

    if(end - start > 100){

        document.body.innerHTML =
        "<h1 style='color:red;text-align:center;margin-top:100px;'>SECURITY BLOCKED</h1>";

    }

}

setInterval(detectDevTools,1000);

})();

// ===== KLIK NOMOR KANTONG AUTO COPY =====
document.addEventListener("click", function(e){

    if(e.target.tagName === "TD" && e.target.parentElement.parentElement.id === "listKantong"){

        var teks = e.target.innerText;

        navigator.clipboard.writeText(teks).then(function(){

            e.target.style.background = "#00c896";

            setTimeout(function(){

                e.target.style.background = "";

            },500);

        });

    }

});

</script>

</body>
</html>
