<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RESI CHECKER B@-IT</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:
linear-gradient(
135deg,
#0f172a 0%,
#1e3a8a 25%,
#7c3aed 50%,
#ea580c 75%,
#dc2626 100%
);
background-size:400% 400%;
animation:bgMove 12s ease infinite;

color:white;
min-height:100vh;
padding:25px;
}

@keyframes bgMove{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}

.container{
max-width:1400px;
margin:auto;
animation:fadeIn .5s ease;
}

.header{
background:#1e293b;
padding:20px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 10px 30px rgba(0,0,0,.4);

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
}

.header h1{
font-size:32px;
color:#818cf8;
}

.header h1{

font-size:32px;
color:#818cf8;

text-shadow:
0 0 20px
rgba(129,140,248,.6);

}

.drop-area{
border:3px dashed #6366f1;
border-radius:25px;
padding:50px;
text-align:center;
background:rgba(30,41,59,.95);
cursor:pointer;
transition:.3s;
margin-bottom:20px;
backdrop-filter:blur(10px);
}

.drop-area:hover{
background:#263548;
transform:scale(1.01);
box-shadow:
0 0 30px
rgba(99,102,241,.4);
}

tr{
transition:.2s;
}

tbody tr:hover{
background:#334155;
}

input[type=file]{
display:none;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-bottom:20px;
}

.card{
padding:20px;
border-radius:22px;
text-align:center;
backdrop-filter:blur(15px);
transition:.4s;
cursor:pointer;
position:relative;
overflow:hidden;
border:none;
}

.stats .card:nth-child(1){
background:
linear-gradient(
135deg,
#2563eb,
#60a5fa
);
}

.stats .card:nth-child(2){
background:
linear-gradient(
135deg,
#f59e0b,
#facc15
);
}

.stats .card:nth-child(3){
background:
linear-gradient(
135deg,
#22c55e,
#16a34a
);
}

.stats .card:nth-child(4){
background:
linear-gradient(
135deg,
#ef4444,
#f97316
);
}

.card:hover{

transform:
translateY(-10px)
scale(1.05);

box-shadow:
0 0 20px rgba(255,255,255,.3),
0 0 40px rgba(255,255,255,.2),
0 20px 50px rgba(0,0,0,.4);

}

.card h2{
font-size:34px;
font-weight:800;
color:white;

text-shadow:
0 0 10px rgba(255,255,255,.8),
0 0 20px rgba(255,255,255,.5),
0 0 30px rgba(255,255,255,.3);
}

.card p{
margin-top:10px;
color:#cbd5e1;
}

textarea{
width:100%;
height:180px;
background:#1e293b;
border:none;
outline:none;
border-radius:15px;
padding:15px;
color:white;
font-size:15px;
margin-bottom:20px;
}

.buttons{
display:flex;
gap:15px;
margin-bottom:20px;
}

.back-wrapper{
display:flex;
justify-content:center;
margin-bottom:20px;
}

.btn-back{
padding:15px 40px;
border:none;
border-radius:50px;
font-size:16px;
font-weight:700;
cursor:pointer;
color:white;

background:
linear-gradient(
135deg,
#ef4444,
#f97316,
#facc15
);

box-shadow:
0 10px 25px rgba(239,68,68,.4),
0 0 20px rgba(249,115,22,.3);

transition:.3s;
position:relative;
overflow:hidden;
}

.btn-back:hover{
transform:
translateY(-4px)
scale(1.05);

box-shadow:
0 15px 35px rgba(239,68,68,.5),
0 0 30px rgba(250,204,21,.5);
}

.btn-back:active{
transform:scale(.95);
}

.btn-back::before{
content:'';
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:
linear-gradient(
90deg,
transparent,
rgba(255,255,255,.4),
transparent
);
transition:.5s;
}

.btn-back:hover::before{
left:100%;
}

button{
flex:1;
padding:15px;
border:none;
border-radius:15px;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:.15s;
position:relative;
overflow:hidden;
}

button:hover{
transform:translateY(-2px);
}

button:active{
transform:scale(.95);
}

.btn-primary{
background:
linear-gradient(
135deg,
#6366f1,
#8b5cf6
);
color:white;
box-shadow:
0 10px 25px
rgba(99,102,241,.4);
}

.btn-success{
background:
linear-gradient(
135deg,
#22c55e,
#16a34a
);
color:white;
box-shadow:
0 10px 25px
rgba(34,197,94,.4);
}

.progress-box{
background:#1e293b;
padding:15px;
border-radius:15px;
margin-bottom:20px;
}

.progress{
height:25px;
background:#334155;
border-radius:20px;
overflow:hidden;
}

.progress-bar{
height:100%;
width:0%;
background:
linear-gradient(
90deg,
#6366f1,
#8b5cf6,
#22c55e
);
transition:.3s;
box-shadow:
0 0 20px
rgba(99,102,241,.6);
}

.table-container{
background:#1e293b;
border-radius:15px;
overflow:auto;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#312e81;
padding:15px;
}

td{
padding:12px;
border-bottom:1px solid #334155;
}

.status-found{
color:#22c55e;
font-weight:bold;
}

.status-not{
color:#ef4444;
font-weight:bold;
}

.message{
margin-top:20px;
padding:20px;
border-radius:15px;
text-align:center;
font-size:18px;
font-weight:bold;
display:none;
}

.success{
background:#14532d;
}

.warning{
background:#7c2d12;
}

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:translateY(0);
}

}

</style>
</head>
<body>

<div class="container">

<div class="header">
<h1>📦 RESI CHECKER B@-IT</h1>
<p>Cek nomor resi pada seluruh sheet Excel dengan cepat</p>
</div>

<label for="excelFile">
<div class="drop-area">
📂 Klik atau Drag & Drop File Excel Disini
<br><br>
(.xlsx / .xls)
</div>
</label>

<input type="file" id="excelFile" accept=".xlsx,.xls">

<div class="stats">

<div class="card">
<h2 id="sheetCount">0</h2>
<p>Total Sheet</p>
</div>

<div class="card">
<h2 id="dataCount">0</h2>
<p>Total Data</p>
</div>

<div class="card">
<h2 id="foundCount">0</h2>
<p>Ditemukan</p>
</div>

<div class="card">
<h2 id="notFoundCount">0</h2>
<p>Tidak Ditemukan</p>
</div>

</div>

<textarea id="resiInput"
placeholder="Masukkan nomor resi satu per baris..."></textarea>

<div class="buttons">
<button class="btn-primary" onclick="cekResi()">
🔍 PROSES CEK
</button>

<button class="btn-success" onclick="exportExcel()">
📥 EXPORT EXCEL
</button>
</div>

<div class="back-wrapper">
<button class="btn-back" onclick="kembaliKeMenu()">
🏠 KEMBALI KE MENU UTAMA
</button>
</div>

<div class="progress-box">
<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>
</div>

<div class="table-container">

<table>

<thead>
<tr>
<th>No</th>
<th>Nomor Resi</th>
<th>Status</th>
<th>Ditemukan Pada Sheet</th>
</tr>
</thead>

<tbody id="hasilTable"></tbody>

</table>

</div>

<div id="message" class="message"></div>

</div>

<script>

let workbookData=null;
let databaseResi={};
let hasilExport=[];

document.getElementById("excelFile")
.addEventListener("change",loadExcel);

function loadExcel(e){

const file=e.target.files[0];

if(!file) return;

const reader=new FileReader();

reader.onload=function(evt){

databaseResi={};

const data=new Uint8Array(evt.target.result);

workbookData=XLSX.read(data,{
type:'array'
});

let totalData=0;

workbookData.SheetNames.forEach(sheetName=>{

let sheet=workbookData.Sheets[sheetName];

let rows=XLSX.utils.sheet_to_json(sheet,{
header:1,
defval:""
});

// Cari posisi header
const header = rows[0].map(h => String(h).trim().toUpperCase());

const idxKantong = header.findIndex(h => h.includes("KANTONG"));
const idxResi = header.findIndex(h => h.includes("RESI"));

for(let i=1;i<rows.length;i++){

    const row = rows[i];

    const kantong = idxKantong>=0 ? String(row[idxKantong] || "").trim() : "";
    const resi = idxResi>=0 ? String(row[idxResi] || "").trim() : "";

    if(!resi) continue;

    totalData++;

    if(!databaseResi[resi]){
        databaseResi[resi]=[];
    }

    const info = kantong
        ? `${sheetName} ( ${kantong} )`
        : sheetName;

    if(!databaseResi[resi].includes(info)){
        databaseResi[resi].push(info);
    }
}

});

document.getElementById("sheetCount").innerText=
workbookData.SheetNames.length;

document.getElementById("dataCount").innerText=
totalData.toLocaleString();

alert("Excel berhasil dimuat!");

};

reader.readAsArrayBuffer(file);

}

function cekResi(){

let input=document
.getElementById("resiInput")
.value
.split("\n")
.map(x=>x.trim())
.filter(x=>x!="");

if(input.length===0){
alert("Masukkan nomor resi!");
return;
}

let tbody=document.getElementById("hasilTable");

tbody.innerHTML="";

hasilExport=[];

let ditemukan=0;
let tidakDitemukan=0;

input.forEach((resi,index)=>{

let status="";
let sheet="";

if(databaseResi[resi]){

console.log(databaseResi[resi]);

status="ADA";
sheet=databaseResi[resi].join(", ");

ditemukan++;

}else{

status="TIDAK ADA";
sheet="-";

tidakDitemukan++;

}

hasilExport.push({
No:index+1,
Resi:resi,
Status:status,
Sheet:sheet
});

let persen=((index+1)/input.length)*100;

document.getElementById("progressBar")
.style.width=persen+"%";

});

hasilExport.sort((a,b)=>{

if(a.Status==="ADA" && b.Status==="TIDAK ADA") return -1;

if(a.Status==="TIDAK ADA" && b.Status==="ADA") return 1;

return 0;

});

tbody.innerHTML="";

hasilExport.forEach((item,index)=>{

tbody.innerHTML+=`
<tr>
<td>${index+1}</td>
<td>${item.Resi}</td>
<td class="${
item.Status=="ADA"
?"status-found"
:"status-not"
}">
${item.Status}
</td>
<td>${item.Sheet}</td>
</tr>
`;

});

document.getElementById("foundCount")
.innerText=ditemukan;

document.getElementById("notFoundCount")
.innerText=tidakDitemukan;

let msg=document.getElementById("message");

if(ditemukan===0){

msg.className="message success";

msg.innerHTML=
"🎉 SELAMAT! Tidak ditemukan nomor resi yang sama.";

}else{

msg.className="message warning";

msg.innerHTML=
"⚠ Ditemukan "+ditemukan+
" nomor resi pada data pengajuan.";

}

msg.style.display="block";

}

function exportExcel(){

if(hasilExport.length===0){

alert("Belum ada hasil untuk diexport!");

return;

}

let ws=XLSX.utils.json_to_sheet(
hasilExport
);

let wb=XLSX.utils.book_new();

XLSX.utils.book_append_sheet(
wb,
ws,
"Hasil Cek"
);

XLSX.writeFile(
wb,
"Hasil_Cek_Resi.xlsx"
);

}

function kembaliKeMenu(){
window.location.href="index.html";
}

</script>

</body>
</html>
