<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>PROSES DATA AWB</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');
*{
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
padding:25px;
min-height:100vh;

/* BACKGROUND NAVY POS + OREN SHOPEE + HIJAU ESP */
background:
radial-gradient(circle at 20% 30%, rgba(34,197,94,0.35), transparent 40%),
radial-gradient(circle at 80% 20%, rgba(249,115,22,0.35), transparent 40%),
radial-gradient(circle at 60% 80%, rgba(37,99,235,0.35), transparent 40%),
linear-gradient(135deg,#0b1e3a,#1e3a8a,#0f172a);

background-attachment:fixed;
overflow-x:hidden;
}

.container{
background:rgba(255,255,255,0.12);
padding:30px;
border-radius:18px;
max-width:1100px;
margin:auto;

backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,0.25);

box-shadow:
0 25px 60px rgba(0,0,0,0.4),
inset 0 0 30px rgba(255,255,255,0.08);

animation:fade 0.6s ease;
}

@keyframes fade{
from{opacity:0;transform:translateY(20px)}
to{opacity:1;transform:translateY(0)}
}

h1{
text-align:center;
margin-bottom:25px;
font-weight:600;
letter-spacing:1px;

color:white;

text-shadow:
0 0 10px rgba(249,115,22,1),
0 0 20px rgba(249,115,22,0.9),
0 0 40px rgba(249,115,22,0.8),
0 0 60px rgba(249,115,22,0.7);
}

label{
display:block;
margin-bottom:6px;
font-weight:600;
font-size:16px;
letter-spacing:0.6px;

color:white;

text-shadow:
0 0 6px rgba(249,115,22,1),
0 0 14px rgba(249,115,22,0.9),
0 0 24px rgba(249,115,22,0.8);
}

.label-title{
font-size:17px;
font-weight:700;
text-transform:uppercase;
margin-top:10px;
margin-bottom:8px;

color:white;

text-shadow:
0 0 10px rgba(249,115,22,1),
0 0 18px rgba(249,115,22,0.9),
0 0 30px rgba(249,115,22,0.8),
0 0 45px rgba(249,115,22,0.7);
}

textarea{
width:100%;
height:180px;
padding:12px;
border-radius:10px;
border:1px solid #cbd5e1;
resize:none;
font-size:14px;
background:#f8fafc;
transition:0.25s;
box-sizing:border-box;
}

textarea:focus{
outline:none;
border:1px solid #1e3a8a;
box-shadow:0 0 8px rgba(30,58,138,0.4);
}

input[type=file]{
padding:8px;
border-radius:8px;
border:1px solid #ddd;
background:#f1f5f9;
}

/* BUTTON */

button{
padding:11px 20px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:500;
margin:6px;
font-size:14px;
transition:0.25s;
color:white;
letter-spacing:0.5px;
}

button:hover{

transform:translateY(-3px) scale(1.03);

box-shadow:
0 0 15px rgba(249,115,22,1),
0 0 30px rgba(249,115,22,0.9),
0 0 45px rgba(249,115,22,0.8),
0 0 60px rgba(249,115,22,0.7);

}

/* PROSES (HIJAU) */

.btn-proses{
background:linear-gradient(45deg,#16a34a,#22c55e);
box-shadow:0 5px 15px rgba(34,197,94,0.4);
}

/* HAPUS (MERAH) */

.btn-hapus{
background:linear-gradient(45deg,#dc2626,#ef4444);
box-shadow:0 5px 15px rgba(239,68,68,0.4);
}

/* COPY (NAVY) */

.btn-copy{
background:linear-gradient(45deg,#1e3a8a,#2563eb);
box-shadow:0 5px 15px rgba(37,99,235,0.4);
}

/* EXPORT (OREN POS) */

.btn-export{
background:linear-gradient(45deg,#ea580c,#f97316);
box-shadow:0 5px 15px rgba(249,115,22,0.4);
}

/* TOMBOL KEMBALI */

.btn-kembali{

display:inline-flex;
align-items:center;
justify-content:center;
vertical-align:middle;

height:44px;
padding:0 24px;
margin:6px;

border-radius:12px;

font-size:14px;
font-weight:600;
letter-spacing:0.6px;

text-decoration:none;
color:white;

background:
linear-gradient(
45deg,
#7c3aed,
#2563eb,
#06b6d4,
#22c55e
);

background-size:300% 300%;

box-shadow:
0 5px 18px rgba(37,99,235,0.45),
0 0 20px rgba(124,58,237,0.35);

transition:0.35s ease;

animation:kembaliGlow 5s ease infinite;

position:relative;
overflow:hidden;

}

/* HOVER */

.btn-kembali:hover{

transform:translateY(-4px) scale(1.04);

box-shadow:
0 0 20px rgba(59,130,246,0.9),
0 0 40px rgba(6,182,212,0.8),
0 0 60px rgba(34,197,94,0.7);

}

/* EFEK KILAU */

.btn-kembali::before{

content:'';

position:absolute;
top:0;
left:-120%;

width:60%;
height:100%;

background:
linear-gradient(
120deg,
transparent,
rgba(255,255,255,0.7),
transparent
);

transform:skewX(-25deg);

transition:0.7s;

}

.btn-kembali:hover::before{

left:130%;

}

/* ANIMASI WARNA */

@keyframes kembaliGlow{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}

/* INFO */

.info{
margin-top:18px;
font-weight:600;
text-align:center;
font-size:15px;
color:white;
background:linear-gradient(45deg,#1e3a8a,#2563eb);
padding:12px;
border-radius:10px;
box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

/* RESULT GRID */

.result{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-top:25px;
}

/* BOX */

.box{
background:white;
padding:18px;
border-radius:14px;
border-top:5px solid #f97316;

box-shadow:
0 10px 25px rgba(0,0,0,0.2),
0 0 20px rgba(249,115,22,0.35);

transition:0.3s;
}

.box:hover{
transform:translateY(-4px);
box-shadow:0 15px 35px rgba(0,0,0,0.2);
}

.box h3{
margin-top:0;
margin-bottom:10px;
color:#1e293b;
font-weight:600;
}

.box textarea{
height:160px;
}

/* MOBILE */

@media(max-width:700px){

.result{
grid-template-columns:1fr;
}

}

button{

position:relative;
overflow:hidden;

}

button::after{

content:'';
position:absolute;
top:-50%;
left:-50%;
width:200%;
height:200%;

background:linear-gradient(
120deg,
transparent,
rgba(255,255,255,0.4),
transparent
);

transform:rotate(25deg);
transition:0.5s;
opacity:0;

}

button:hover::after{

left:100%;
opacity:1;

}

</style>
</head>

<body>

<div class="container">

<h1>PROSES DATA AWB/RESI/CN REJECT BEA CUKAI</h1>

<label class="label-title">UPLOAD FILE EXCEL</label>
<input type="file" id="fileInput">

<br><br>

<label class="label-title">PASTE AWB / RESI / CN YANG DI TOLAK BC</label>

<textarea id="awbInput" placeholder="Paste data disini..."></textarea>

<br>

<button class="btn-proses" onclick="prosesData()">PROSES DATA</button>
<button class="btn-hapus" onclick="clearPaste()">HAPUS</button>

<a href="index.html" class="btn-kembali">
⮌ KEMBALI KE HOME
</a>

<div class="info" id="info"></div>

<div class="result">

<div class="box">
<h3>DATA FIX</h3>
<textarea id="fixData"></textarea>
<br>
<button class="btn-copy" onclick="copyFix()">COPY</button>
<button class="btn-export" onclick="exportFix()">EXPORT</button>
<button class="btn-hapus" onclick="clearFix()">CLEAR</button>
</div>

<div class="box">
<h3>DATA REJECT</h3>
<textarea id="rejectData"></textarea>
<br>
<button class="btn-copy" onclick="copyReject()">COPY</button>
<button class="btn-export" onclick="exportReject()">EXPORT</button>
<button class="btn-hapus" onclick="clearReject()">CLEAR</button>
</div>

</div>

</div>

<script>

let excelData=[]
let header=[]
let dataReject=[]
let dataFix=[]

document.getElementById("fileInput").addEventListener("change",function(e){

const file=e.target.files[0]
const reader=new FileReader()

reader.onload=function(evt){

const data=new Uint8Array(evt.target.result)
const workbook=XLSX.read(data,{
type:'array',
cellDates:true,
raw:false
})
const sheet=workbook.Sheets[workbook.SheetNames[0]]

excelData=XLSX.utils.sheet_to_json(sheet,{header:1})

header=excelData[0]
excelData=excelData.slice(1)

document.getElementById("info").innerText=
"DATA FILE : "+excelData.length+" | Reject : 0 | Fix : 0"

}

reader.readAsArrayBuffer(file)

})

function prosesData(){

let indexTgl = header.findIndex(h=>String(h).toUpperCase().includes("TGL"));
let indexHarga = header.findIndex(h=>String(h).toUpperCase().includes("HARGA"));

const awbText=document.getElementById("awbInput").value

const awbList=awbText.split(/\n|,|\s/).map(x=>x.trim()).filter(x=>x)

let indexAWB=header.findIndex(h=>String(h).toUpperCase().includes("AWB"))

if(indexAWB==-1){

alert("Kolom AWB tidak ditemukan")

return

}

dataReject=[]
dataFix=[]

excelData.forEach(row=>{

// FORMAT TANGGAL
if(indexTgl!=-1 && row[indexTgl]){

let d

if(row[indexTgl] instanceof Date){
d=row[indexTgl]
}else{
d=new Date(row[indexTgl])
}

if(!isNaN(d)){
let y=d.getFullYear()
let m=String(d.getMonth()+1).padStart(2,'0')
let da=String(d.getDate()).padStart(2,'0')

row[indexTgl]=`${y}/${m}/${da}`
}

}

// FORMAT HARGA
if(indexHarga!=-1 && row[indexHarga]){

let harga = String(row[indexHarga]).replace(/[^0-9]/g,'')

// jika 1 digit → tambah 0000
if(harga.length == 1){
    harga = harga + "0000"
}

// jika 2 digit → tambah 000
else if(harga.length == 2){
    harga = harga + "000"
}

// jika 3 digit → tambah 00
else if(harga.length == 3){
    harga = harga + "00"
}

// jika 4 digit → tambah 0
else if(harga.length == 4){
    harga = harga + "0"
}

row[indexHarga] = harga

}

let awb=row[indexAWB]

if(awbList.includes(String(awb))){

dataReject.push(row)

}else{

dataFix.push(row)

}

})

document.getElementById("rejectData").value=dataReject.map(r=>r.join("\t")).join("\n")
document.getElementById("fixData").value=dataFix.map(r=>r.join("\t")).join("\n")

document.getElementById("info").innerText=
"TOTAL FILE : "+excelData.length+
" | DATA REJECT : "+dataReject.length+
" | DATA FIX : "+dataFix.length
}

function clearPaste(){
document.getElementById("awbInput").value=""
}

function copyReject(){

navigator.clipboard.writeText(document.getElementById("rejectData").value)

alert("Data Reject dicopy")

}

function copyFix(){

navigator.clipboard.writeText(document.getElementById("fixData").value)

alert("Data Fix dicopy")

}

function exportReject(){

exportExcel([header,...dataReject],"DATA_REJECT.xlsx")

}

function exportFix(){

exportExcel([header,...dataFix],"DATA_FIX.xlsx")

}

function exportExcel(data,nama){

let indexNo = header.findIndex(h => String(h).toUpperCase().includes("NO"))

// URUTKAN NOMOR
if(indexNo != -1){
for(let i=1;i<data.length;i++){
data[i][indexNo] = i
}
}

let ws=XLSX.utils.aoa_to_sheet(data)

let range=XLSX.utils.decode_range(ws['!ref'])

for(let R=range.s.r;R<=range.e.r;R++){
for(let C=range.s.c;C<=range.e.c;C++){

let cell_address=XLSX.utils.encode_cell({r:R,c:C})

if(!ws[cell_address]) continue

ws[cell_address].s={
border:{
top:{style:"thin"},
bottom:{style:"thin"},
left:{style:"thin"},
right:{style:"thin"}
},
alignment:{
vertical:"center",
horizontal:"center"
}
}

if(R===0){

ws[cell_address].s.fill={
fgColor:{rgb:"2563EB"}
}

ws[cell_address].s.font={
bold:true,
color:{rgb:"FFFFFF"}
}

}
if(header[C] && String(header[C]).toUpperCase().includes("TGL")){
ws[cell_address].z="yyyy/mm/dd"
}
}

}

// AUTO WIDTH KOLOM
let colWidths = header.map((h,i) => {

let max = String(h).length

data.forEach(row => {

let cell = row[i] ? String(row[i]) : ""

if(cell.length > max){
max = cell.length
}

})

return { wch: max + 3 }

})

ws['!cols'] = colWidths

let wb=XLSX.utils.book_new()

XLSX.utils.book_append_sheet(wb,ws,"DATA")

XLSX.writeFile(wb,nama)

}

function clearFix(){

document.getElementById("fixData").value=""
dataFix=[]

}

function clearReject(){

document.getElementById("rejectData").value=""
dataReject=[]

}

/* ===== ANTI INSPECT ===== */

document.addEventListener('contextmenu', function(e){
    e.preventDefault();
});

document.onkeydown = function(e){

    // F12
    if(e.keyCode == 123){
        return false;
    }

    // CTRL + SHIFT + I
    if(e.ctrlKey && e.shiftKey && e.keyCode == 73){
        return false;
    }

    // CTRL + SHIFT + J
    if(e.ctrlKey && e.shiftKey && e.keyCode == 74){
        return false;
    }

    // CTRL + U
    if(e.ctrlKey && e.keyCode == 85){
        return false;
    }

    // CTRL + SHIFT + C
    if(e.ctrlKey && e.shiftKey && e.keyCode == 67){
        return false;
    }

};

document.onselectstart = function(){
return false;
};

document.oncopy = function(){
return false;
};

(function(){

function detectDevTools(){

    const start = new Date();

    debugger;

    const end = new Date();

    if(end - start > 100){

        document.body.innerHTML =
        "<h1 style='color:red;text-align:center;margin-top:100px;'>SECURITY BLOCKED</h1>";

    }

}

setInterval(detectDevTools,1000);

})();

</script>

</body>
</html>
