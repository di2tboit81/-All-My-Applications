function cleanText(text){
return text.toLowerCase().replace(/[^a-z0-9\s]/g," ").split(/\s+/)
}

function findHS(text){

    // jika kosong
    if(!text || String(text).trim()===""){
        return "85437099";
    }

    text = String(text).toLowerCase();

    let bestScore = 0;
    let bestHS = "";

    hsDatabase.forEach(item=>{

        let score = 0;

        item.keywords.forEach(keyword=>{

            keyword = keyword.toLowerCase();

            // cocok full keyword
            if(text.includes(keyword)){
                score += keyword.length + 10;
            }

            // cocok per kata
            let keyWords = keyword.split(/\s+/);

            keyWords.forEach(k=>{

                if(k.length < 2) return;

                if(text.includes(k)){
                    score++;
                }

            });

        });

        if(score > bestScore){
            bestScore = score;
            bestHS = item.hs;
        }

    });

    // jika tidak ditemukan database
    if(bestScore <= 0){
        return "85437099";
    }

    return bestHS;
}

function processExcel(){

let file=document.getElementById("excelFile").files[0]
let reader=new FileReader()

reader.onload=function(e){

let data=new Uint8Array(e.target.result)
let workbook=XLSX.read(data,{type:'array'})
let sheet=workbook.Sheets[workbook.SheetNames[0]]
let rows=XLSX.utils.sheet_to_json(sheet)

let tbody=document.getElementById("tableBody")
tbody.innerHTML=""
outputData=[]

rows.forEach(r=>{

let uraian=r.URAIAN
let hs=findHS(uraian)

outputData.push({URAIAN:uraian,HSCODE:hs})

let tr=document.createElement("tr")
tr.innerHTML=`
  <td data-label="ISI URAIAN">${uraian}</td>
  <td data-label="HS CODE">${hs}</td>
`
tbody.appendChild(tr)

})

}

reader.readAsArrayBuffer(file)
}

function downloadExcel(){
let ws=XLSX.utils.json_to_sheet(outputData)
let wb=XLSX.utils.book_new()
XLSX.utils.book_append_sheet(wb,ws,"HS CODE")
XLSX.writeFile(wb,"hasil_hscode.xlsx")
}

document.getElementById("hsCount").textContent = hsDatabase.length;

const canvas = document.getElementById("bgCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for(let i=0;i<120;i++){
    particles.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*2+1,
        dx:(Math.random()-0.5)*0.6,
        dy:(Math.random()-0.5)*0.6
    });
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="rgba(0,255,255,0.8)";

    particles.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fill();

        p.x+=p.dx;
        p.y+=p.dy;

        if(p.x<0||p.x>canvas.width) p.dx*=-1;
        if(p.y<0||p.y>canvas.height) p.dy*=-1;
    });

    requestAnimationFrame(animate);
}

animate();

window.onresize=()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
};

/* ===== ANTI INSPECT ===== */

document.addEventListener('contextmenu', function(e){
    e.preventDefault();
});

document.onkeydown = function(e){

    // F12
    if(e.keyCode == 123){
        return false;
    }

    // CTRL + SHIFT + I
    if(e.ctrlKey && e.shiftKey && e.keyCode == 73){
        return false;
    }

    // CTRL + SHIFT + J
    if(e.ctrlKey && e.shiftKey && e.keyCode == 74){
        return false;
    }

    // CTRL + U
    if(e.ctrlKey && e.keyCode == 85){
        return false;
    }

    // CTRL + SHIFT + C
    if(e.ctrlKey && e.shiftKey && e.keyCode == 67){
        return false;
    }

};


document.onselectstart = function(e){

    if(e.target.closest("#listKantong")){
        return true;
    }

    return false;
};

// ===== KLIK NOMOR KANTONG AUTO COPY =====
document.addEventListener("click", function(e){

    if(e.target.tagName === "TD" && e.target.parentElement.parentElement.id === "listKantong"){

        var teks = e.target.innerText;

        navigator.clipboard.writeText(teks).then(function(){

            // efek notifikasi kecil
            e.target.style.background = "#00c896";

            setTimeout(function(){
                e.target.style.background = "";
            },500);

        });

    }

});
